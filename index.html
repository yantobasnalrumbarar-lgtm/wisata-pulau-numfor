<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak - Yanto Rumbarar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 950px;
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      overflow: hidden;
    }

    .contact-info {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .profile-photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 4px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 18px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .profile-photo:hover {
      transform: scale(1.07);
      box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3);
    }

    .contact-info h2 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .contact-info .jabatan {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 22px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .contact-info > p {
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 28px;
      opacity: 0.9;
    }

    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      width: 100%;
      text-align: left;
    }

    .info-item .icon {
      background: rgba(255, 255, 255, 0.2);
      min-width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 14px;
      font-size: 16px;
      transition: background 0.3s;
    }

    .info-item:hover .icon {
      background: rgba(255, 255, 255, 0.4);
    }

    .info-item .text {
      font-size: 13px;
      word-break: break-word;
      line-height: 1.5;
    }

    .info-item a {
      color: #fff;
      text-decoration: none;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.5);
      transition: border-color 0.3s;
    }

    .info-item a:hover {
      border-bottom-color: #fff;
    }

    .contact-form {
      padding: 40px 35px;
    }

    .contact-form h2 {
      color: #1e3c72;
      margin-bottom: 25px;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-size: 13px;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #2a5298;
      box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 110px;
    }

    .btn-submit {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff;
      border: none;
      padding: 14px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30, 60, 114, 0.4);
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
      .contact-info { padding: 35px 25px; }
      .contact-form { padding: 30px 25px; }
      .profile-photo { width: 120px; height: 120px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="contact-info">
      <!-- FOTO PROFIL - pakai file lokal -->
      <img 
        src="yanto rumbarar.jpg" 
        alt="Foto Profil Yanto Rumbarar" 
        class="profile-photo"
      >

      <h2>Yanto Rumbarar</h2>
      <p class="jabatan">Lokasi Saat Ini</p>

      <p>Silakan hubungi saya untuk informasi lebih lanjut.</p>

      <div class="info-item">
        <div class="icon">📍</div>
        <span class="text">Manokwari, Papua Barat</span>
      </div>

      <div class="info-item">
        <div class="icon">📞</div>
        <span class="text">
          <a href="tel:081356425629">0813-5642-5629</a>
        </span>
      </div>

      <div class="info-item">
        <div class="icon">✉️</div>
        <span class="text">
          <a href="mailto:yantobasnalrumbarar@gmail.com">yantobasnalrumbarar@gmail.com</a>
        </span>
      </div>
    </div>

    <div class="contact-form">
      <h2>Kirim Pesan</h2>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Masukkan email Anda" required>
        </div>

        <div class="form-group">
          <label for="subjek">Subjek</label>
          <input type="text" id="subjek" name="subjek" placeholder="Subjek pesan" required>
        </div>

        <div class="form-group">
          <label for="pesan">Pesan</label>
          <textarea id="pesan" name="pesan" placeholder="Tulis pesan Anda di sini..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Pesan</button>
      </form>
    </div>
  </div>

</body>
</html>
